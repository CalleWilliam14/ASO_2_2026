---
# tasks file for apache
- name: Instalar Apache
  zypper:
    name: apache2
    state: present
    disable_recommends: yes

- name: Iniciar servicio Apache
  systemd:
    name: apache2
    state: started
    enabled: yes

- name: Permitir servicios HTTP y HTTPS
  ansible.posix.firewalld:
    service: "{{ item }}"
    permanent: true
    state: enabled
    immediate: true
  loop:
    - http
    - https
